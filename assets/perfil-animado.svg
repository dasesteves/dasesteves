    <circle cx="961" cy="203" r="11"/><circle cx="1000" cy="129" r="7"/><circle cx="1062" cy="98" r="4"/>
    <circle cx="1042" cy="190" r="8"/><circle cx="1111" cy="152" r="5"/><circle cx="1094" cy="247" r="6"/><circle cx="982" cy="254" r="5"/>
  </g>
  <circle class="halo" cx="903" cy="144" r="25" stroke="#79D6BE" stroke-opacity="0.4"/>
  <circle class="halo halo-second" cx="961" cy="203" r="21" stroke="#8BB6EA" stroke-opacity="0.4"/>
</svg>
