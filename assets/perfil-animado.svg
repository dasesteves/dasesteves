<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Diogo Esteves</title>
  <style>
    .signal { stroke-dasharray: 5 95; stroke-dashoffset: 5; opacity: 0;
      animation: flow 9s linear infinite; }
    .signal-second { animation-delay: -4.5s; }
    .halo { transform-box: fill-box; transform-origin: center;
      animation: breathe 6s ease-in-out infinite; }
    .halo-second { animation-delay: -3s; }
    @keyframes flow {
      0% { stroke-dashoffset: 5; opacity: 0; }
      8%, 78% { opacity: 0.9; }
      90%, 100% { stroke-dashoffset: -100; opacity: 0; }
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.65; }
      50% { transform: scale(1.22); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .signal { animation: none; opacity: 0; }
      .halo { animation: none; }
    }
  </style>
  <desc id="desc">Biologia, bioinformática e software na saúde. Composição abstrata de células e ligações entre dados.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse"><stop stop-color="#102936"/><stop offset="1" stop-color="#10202D"/></linearGradient>
    <linearGradient id="line" x1="752" y1="96" x2="1098" y2="250" gradientUnits="userSpaceOnUse"><stop stop-color="#73D6BE"/><stop offset="1" stop-color="#7DAEEA"/></linearGradient>
  </defs>
  <rect width="1200" height="340" rx="16" fill="url(#bg)"/>
  <path d="M48 46H98" stroke="#77D8BF" stroke-width="4"/>
  <text x="48" y="84" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="3" fill="#A2C2CC">BIOLOGIA · DADOS · SOFTWARE</text>
  <text x="44" y="177" font-family="Georgia,Times New Roman,serif" font-size="80" letter-spacing="-2" fill="#F3F1E9">Diogo Esteves</text>
  <text x="48" y="225" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#C4D9DF">Bioinformática e tecnologia na saúde</text>
  <text x="48" y="298" font-family="Segoe UI,Arial,sans-serif" font-size="17" letter-spacing="1.5" fill="#91B5C0">BRAGA, PORTUGAL</text>
  <g stroke="#476C7A" stroke-opacity="0.45">
    <path d="M762 49V292M822 49V292M882 49V292M942 49V292M1002 49V292M1062 49V292M1122 49V292"/>
    <path d="M738 80H1150M738 140H1150M738 200H1150M738 260H1150"/>
  </g>
  <g stroke="url(#line)" stroke-width="1.7" stroke-opacity="0.65">
