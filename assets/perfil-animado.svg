    <path d="M841 114L845 190L903 144L961 203L1000 129L1042 190L961 203L982 254M845 190L890 226L903 144M1062 98L1042 190"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-width="3">
    <path class="signal" d="M759 227L790 170L841 114L903 144L961 203L1042 190L1111 152" pathLength="100" stroke="#B5F7E3"/>
    <path class="signal signal-second" d="M834 269L890 226L903 144L936 83L1000 129L1062 98" pathLength="100" stroke="#A6CFFF"/>
  </g>
  <g fill="#79D6BE">
    <circle cx="790" cy="170" r="10"/><circle cx="841" cy="114" r="7"/><circle cx="845" cy="190" r="5"/>
    <circle cx="903" cy="144" r="14"/><circle cx="936" cy="83" r="5"/><circle cx="890" cy="226" r="8"/>
    <circle cx="834" cy="269" r="4"/><circle cx="759" cy="227" r="4"/>
