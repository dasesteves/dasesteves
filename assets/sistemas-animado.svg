    <ellipse cx="1040" cy="170" rx="156" ry="150" fill="url(#digital)" />
    <ellipse cx="823" cy="178" rx="79" ry="98" transform="rotate(-25 823 178)" stroke="#6CE0B2" stroke-opacity="0.16" />
