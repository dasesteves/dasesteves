<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Diogo Esteves</title>
  <style>
    .signal { stroke-dasharray: 5 95; stroke-dashoffset: 5; opacity: 0;
      animation: flow 9s linear infinite; }
    .signal-second { animation-delay: -4.5s; }
    .halo { transform-box: fill-box; transform-origin: center;
      animation: breathe 6s ease-in-out infinite; }
    .halo-second { animation-delay: -3s; }
    @keyframes flow {
      0% { stroke-dashoffset: 5; opacity: 0; }
      8%, 78% { opacity: 0.9; }
      90%, 100% { stroke-dashoffset: -100; opacity: 0; }
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.65; }
      50% { transform: scale(1.22); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .signal { animation: none; opacity: 0; }
      .halo { animation: none; }
    }
  </style>
  <desc id="desc">Biologia, dados e software. Uma rede contínua em verde, azul e âmbar liga formas orgânicas e geométricas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10342F" />
      <stop offset="0.52" stop-color="#122B38" />
      <stop offset="1" stop-color="#262743" />
    </linearGradient>
    <linearGradient id="line" x1="752" y1="96" x2="1098" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6CE0B2" />
      <stop offset="0.5" stop-color="#F3BE82" />
      <stop offset="1" stop-color="#A6B5FF" />
    </linearGradient>
    <radialGradient id="bio">
      <stop stop-color="#45C597" stop-opacity="0.16" />
      <stop offset="1" stop-color="#45C597" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="digital">
      <stop stop-color="#9B87EF" stop-opacity="0.22" />
      <stop offset="1" stop-color="#9B87EF" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="280" rx="16" fill="url(#bg)" />
  <path d="M48 38H98" stroke="#6CE0B2" stroke-width="4" />
  <text x="48" y="76" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="3" fill="#A2D2CE">BIOLOGIA · DADOS · SOFTWARE</text>
  <text x="44" y="164" font-family="Georgia,Times New Roman,serif" font-size="80" letter-spacing="-2" fill="#F3F1E9">Diogo Esteves</text>
  <text x="48" y="231" font-family="Segoe UI,Arial,sans-serif" font-size="17" letter-spacing="1.5" fill="#A1BBC7">BRAGA, PORTUGAL</text>
